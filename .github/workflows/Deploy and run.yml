name: Deploy and Run

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

jobs:
  deploy_and_run:
    environment: main
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the Databricks CLI
        uses: databricks/setup-cli@v1.13.0

      - name: Deploy the committed state
        run: databricks bundle deploy -t dev

      - name: Run the deployed job
        run: databricks bundle run churn_scoring -t dev
