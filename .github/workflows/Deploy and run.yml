name: Deploy and Run

on:
  workflow_dispatch:

jobs:
  deploy_and_run:
    environment: main
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the Databricks CLI
        uses: databricks/setup-cli@v1.13.0
        
      - name: Ask the workspace who this token belongs to
        run: databricks current-user me -o json | jq -r .userName

      - name: Deploy the committed state
        run: databricks bundle deploy -t dev

      - name: Run the deployed job
        run: databricks bundle run sample_job -t dev
        
  notification:
      if: always()
      uses: ./.github/workflows/Reusable Notification.yml
      secrets: inherit
      with:
        message: |
          DS... งานเสร็จแล้วว้อยยย
          Message: ${{ github.event.head_commit.message }}
