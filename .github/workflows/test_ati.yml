name: test_get

on:
  workflow_dispatch:

jobs:
  deploy_and_run:
    environment: main
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the Databricks CLI
        uses: databricks/setup-cli@v1.13.0
        
      - name: Ask the workspace who this token belongs to
        run: databricks current-user me -o json | jq -r .userName

      - name: Read the run MLflow recorded, and assert on it
        run: |
          U=$(databricks current-user me -o json | jq -r .userName)
          EXP=$(databricks experiments get-by-name "/Shared/sudsuay_titanic_xgb" -o json \
                | jq -r .experiment.experiment_id)
          echo "experiment $EXP"

          databricks experiments search-runs --json "{
            \"experiment_ids\": [\"$EXP\"],
            \"max_results\": 1,
            \"order_by\": [\"attributes.start_time DESC\"]
          }" -o json > run.json
