 
# This is a Declarative Automation Bundle definition for sudsuay_group.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sudsuay_group
  uuid: 8a1cc92f-6a79-45fa-9252-906dd1d43243
  

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  rootpath_notebook: 
    default:  /Workspace/Users/chayapaw@ais.co.th/.bundle/${bundle.name}/${bundle.target}/files/src

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-1502583690645883.3.azuredatabricks.net
    variables:
      catalog: ctl_training_dev
      schema: m3
    presets:
      artifacts_dynamic_version: true
    permissions:
      - user_name: santitham.pro@kmutt.ac.th
        level: CAN_MANAGE
      - user_name: jakkaphe@ais.co.th
        level: CAN_MANAGE
      - user_name: chayapaw@ais.co.th
        level: CAN_MANAGE
      - user_name: prakritm@ais.co.th
        level: CAN_MANAGE
      - user_name: natnasal@ais.co.th
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://adb-1502583690645883.3.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/santitham.pro@kmutt.ac.th to make sure we only have a single copy.
      root_path: /Workspace/Users/chayapaw@ais.co.th/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ctl_training_dev
      schema: m3
      
    permissions:
      - user_name: santitham.pro@kmutt.ac.th
        level: CAN_MANAGE
      - user_name: jakkaphe@ais.co.th
        level: CAN_MANAGE
      - user_name: chayapaw@ais.co.th
        level: CAN_MANAGE
