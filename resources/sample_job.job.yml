# A sample job for sudsuay_group.

resources:
  jobs:
    sample_job:
      name: sud_suay_groups_final_v1

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      

      tasks:
        - task_key: 01_load_titanic_to_spark
          notebook_task:
            notebook_path: ${var.rootpath_notebook}/01_load_titanic_to_spark
          existing_cluster_id: 0318-031919-b3fa4xtr
        - task_key: 02_prep_eda
          notebook_task:
            notebook_path: ${var.rootpath_notebook}/02_prep_eda
          depends_on:
            - task_key: 01_load_titanic_to_spark
          existing_cluster_id: 0318-031919-b3fa4xtr
        - task_key: 03_train_evaluate_mlflow
          notebook_task:
            notebook_path: ${var.rootpath_notebook}/03_train_evaluate_mlflow
          depends_on:
            - task_key: 02_prep_eda
          existing_cluster_id: 0318-031919-b3fa4xtr
